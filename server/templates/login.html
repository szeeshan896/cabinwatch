<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CabinWatch</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0d1117; color: #e6edf3; padding: 24px;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 360px; background: #161b22;
    border: 1px solid #30363d; border-radius: 14px; padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.sub { margin: 0 0 22px; color: #8b949e; font-size: 14px; }
  label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 9px;
    border: 1px solid #30363d; background: #0d1117; color: #e6edf3;
  }
  input:focus { outline: 2px solid #1f6feb; border-color: #1f6feb; }
  button {
    width: 100%; margin-top: 16px; padding: 12px; font-size: 16px;
    font-weight: 600; border: 0; border-radius: 9px; cursor: pointer;
    background: #238636; color: #fff;
  }
  button:hover { background: #2ea043; }
  .err {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px;
    background: #2d1618; border: 1px solid #6e2932; color: #ffb3ba;
  }
  .warn {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
    background: #2b2000; border: 1px solid #6b4b00; color: #ffd98a;
  }
  code { background: #0d1117; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>CabinWatch</h1>
    <p class="sub">Private camera dashboard</p>

    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password"
           autofocus required>
    <button type="submit">Open dashboard</button>

    {% if bad %}<div class="err">Wrong password. Try again.</div>{% endif %}
    {% if not configured %}
      <div class="warn">
        <strong>Not set up yet.</strong><br>
        Set <code>VIEW_PASSWORD</code> and <code>AGENT_TOKEN</code> in your
        Railway service variables, then redeploy.
      </div>
    {% endif %}
  </form>
</body>
</html>
