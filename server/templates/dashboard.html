<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CabinWatch</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: #0d1117; color: #e6edf3; padding: 0 0 40px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
    gap: 10px; padding: 11px 14px; background: #161b22f2;
    backdrop-filter: blur(8px); border-bottom: 1px solid #30363d;
  }
  header h1 { margin: 0; font-size: 16px; letter-spacing: .2px; }
  header .clock { margin-left: auto; font-size: 11px; color: #8b949e; }
  .ghost {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    padding: 6px 10px; border-radius: 7px; font-size: 12px; cursor: pointer;
  }
  .ghost:hover { background: #30363d; }
  main { padding: 14px; max-width: 1500px; margin: 0 auto; }

  .banner {
    margin-bottom: 12px; padding: 10px 12px; border-radius: 9px; font-size: 13px;
    background: #2b2000; border: 1px solid #6b4b00; color: #ffd98a;
  }
  .banner code { background: #0d1117; padding: 1px 5px; border-radius: 4px; }

  .grid {
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  }
  .cam {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .cam.alert { border-color: #d29922; }
  .strip { display: flex; gap: 2px; height: 26px; }
  .strip i { flex: 1; background: #161b22; border-radius: 2px;
             cursor: pointer; border: 1px solid #21262d; }
  .strip i.on { background: #1f6feb; border-color: #1f6feb; }
  .strip i.hot { background: #d29922; border-color: #d29922; }
  .clip .kp.cp { background: #238636; }
  .cam.offline { opacity: .7; }
  .cam.offline .screen { background: #0d1117; }
  .gone { color: #d29922; }
  .gonebox { position: absolute; inset: 0; display: flex;
             flex-direction: column; align-items: center;
             justify-content: center; text-align: center;
             color: #8b949e; font-size: 13px; }
  .gonebox small { color: #6e7681; }

  .cam .top {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid #30363d;
  }
  .cam .top .nm { font-weight: 600; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .dot.on { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .dot.off { background: #6e7681; }
  .still {
    margin-left: auto; font-size: 11px; color: #8b949e; text-align: right;
    line-height: 1.25;
  }
  .still b { color: #3fb950; font-weight: 600; }
  .still b.moving { color: #d29922; }

  .screen {
    position: relative; aspect-ratio: 16/9; background: #010409;
    display: grid; place-items: center; overflow: hidden;
  }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen .idle { color: #6e7681; font-size: 13px; text-align: center; padding: 14px; }
  .screen .pill { position: absolute; top: 7px; left: 7px; display: flex;
                  gap: 5px; flex-wrap: wrap; }
  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 3px 6px;
    border-radius: 20px; background: #0d1117cc; border: 1px solid #30363d;
  }
  .tag.rec { background: #da3633; border-color: #f85149; color: #fff; }
  .tag.pause { background: #6e7681; border-color: #8b949e; color: #fff; }
  .tag.mot { background: #9e6a03; border-color: #d29922; color: #fff; }
  .tag.snd { background: #1f6feb; border-color: #58a6ff; color: #fff; }

  /* PTZ pad, laid over the picture */
  .pad {
    position: absolute; right: 8px; bottom: 8px;
    display: grid; grid-template-columns: repeat(3, 32px);
    grid-template-rows: repeat(3, 32px); gap: 3px;
  }
  .pad button {
    background: #0d1117c9; border: 1px solid #30363d; color: #e6edf3;
    border-radius: 7px; font-size: 14px; cursor: pointer; padding: 0;
  }
  .pad button:active { background: #1f6feb; }
  .pad .mid { font-size: 10px; letter-spacing: .3px; }
  .pad i { display: block; }          /* corner spacers, nothing to press */

  .meter { height: 4px; background: #21262d; }
  .meter > i { display: block; height: 100%; background: #3fb950; width: 0;
               transition: width .15s; }
  .meter > i.hot { background: #f85149; }

  .cam .rows { padding: 10px 12px; display: grid; gap: 8px; }
  .seg { display: flex; border: 1px solid #30363d; border-radius: 8px;
         overflow: hidden; }
  .seg button {
    flex: 1; padding: 7px 3px; font-size: 12px; background: #0d1117;
    color: #8b949e; border: 0; cursor: pointer; border-right: 1px solid #30363d;
  }
  .seg button:last-child { border-right: 0; }
  .seg button.sel { background: #1f6feb; color: #fff; font-weight: 600; }

  .btns { display: flex; gap: 7px; flex-wrap: wrap; }
  .btns button {
    flex: 1 1 auto; min-width: 72px; padding: 8px 6px; font-size: 12px;
    border-radius: 8px; border: 1px solid #30363d; background: #21262d;
    color: #e6edf3; cursor: pointer;
  }
  .btns button.active { background: #238636; border-color: #2ea043; font-weight: 600; }
  .btns button.recon { background: #da3633; border-color: #f85149; font-weight: 600; }
  .btns button.talking { background: #1f6feb; border-color: #58a6ff; font-weight: 600; }
  .btns button:disabled { opacity: .4; cursor: default; }

  .inline { display: flex; gap: 7px; align-items: center; }
  .inline select, .inline input[type=range] {
    flex: 1; min-width: 0; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 7px; padding: 6px 8px;
    font-size: 12px;
  }
  .inline label { font-size: 11px; color: #6e7681; flex: 0 0 auto; }
  .stats { font-size: 11px; color: #6e7681; display: flex; gap: 9px; flex-wrap: wrap; }
  .stats .bad { color: #f85149; }

  /* What the device itself is up to, as opposed to what it can see. */
  .device { font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap;
            align-items: center; }
  .device:empty { display: none; }
  .device .bat { color: #8b949e; }
  .device .bat.low { color: #f85149; font-weight: 600; }
  .device .bat.chg { color: #3fb950; }
  .device a { color: #58a6ff; text-decoration: none; }
  .device a:hover { text-decoration: underline; }
  .device .tamper { color: #ff7b72; font-weight: 600; }

  .empty {
    border: 1px dashed #30363d; border-radius: 12px; padding: 32px 20px;
    text-align: center; color: #8b949e;
  }
  .empty h2 { margin: 0 0 8px; font-size: 17px; color: #e6edf3; }
  .empty code { background: #0d1117; padding: 2px 6px; border-radius: 5px; font-size: 13px; }

  h2.sec { font-size: 13px; color: #8b949e; margin: 24px 0 9px;
           text-transform: uppercase; letter-spacing: .8px; }
  .events { display: grid; gap: 7px; }
  .ev { display: flex; gap: 10px; align-items: center; padding: 7px 10px;
        background: #161b22; border: 1px solid #30363d; border-radius: 9px; }
  .ev img { width: 74px; height: 42px; object-fit: cover; border-radius: 5px;
            background: #010409; flex: 0 0 auto; cursor: pointer; }
  .ev .txt { min-width: 0; }
  .ev .k { font-size: 13px; font-weight: 600; }
  .ev .d { font-size: 11px; color: #8b949e; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .ev .t { margin-left: auto; font-size: 11px; color: #6e7681;
           flex: 0 0 auto; text-align: right; }
  .ev.k-impact .k, .ev.k-person .k, .ev.k-moved .k,
  .ev.k-unplugged .k { color: #ff7b72; }
  .ev.k-battery_low .k { color: #d29922; }
  .ev.k-cry .k { color: #ffa657; }
  .ev.k-offline .k { color: #d29922; }
  .ev .saved { color: #3fb950; font-size: 11px; text-decoration: none; }
  .ev .saved:hover { text-decoration: underline; }

  /* modal for recordings stored on a device */
  #modal {
    position: fixed; inset: 0; background: #010409d9; z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  #modal.show { display: flex; }
  #modal .panel {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    width: 100%; max-width: 620px; max-height: 86vh; display: flex;
    flex-direction: column;
  }
  #modal .ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
               border-bottom: 1px solid #30363d; }
  #modal .ph h3 { margin: 0; font-size: 15px; }
  #modal .pb { overflow: auto; padding: 10px 14px; }
  #modal video { width: 100%; border-radius: 8px; background: #010409;
                 margin-bottom: 10px; }
  .clip { display: flex; gap: 10px; align-items: center; padding: 7px 0;
          border-bottom: 1px solid #21262d; font-size: 13px; }
  .clip:last-child { border-bottom: 0; }
  .clip .kp { font-size: 10px; padding: 2px 6px; border-radius: 10px;
              background: #9e6a03; color: #fff; }
  .clip .sp { margin-left: auto; display: flex; gap: 6px; }
  .clip a, .clip button {
    font-size: 12px; padding: 5px 9px; border-radius: 6px; cursor: pointer;
    background: #21262d; border: 1px solid #30363d; color: #e6edf3;
    text-decoration: none;
  }
</style>
</head>
<body>
<header>
  <h1>CabinWatch</h1>
  <span class="clock" id="clock"></span>
  <button class="ghost" onclick="location.href='/camera'">+ Phone</button>
  <form method="post" action="/logout" style="margin:0">
    <button class="ghost" type="submit">Exit</button>
  </form>
</header>

<main>
  <div id="banner"></div>
  <div class="grid" id="grid"></div>
  <h2 class="sec">Recent activity</h2>
  <div class="events" id="events"></div>
</main>

<div id="modal">
  <div class="panel">
    <div class="ph">
      <h3 id="mTitle">Recordings on the device</h3>
      <button class="ghost" style="margin-left:auto" onclick="closeModal()">Close</button>
    </div>
    <div class="pb" id="mBody"></div>
  </div>
</div>

<script>
/* ===========================================================================
   CabinWatch dashboard.

   Video and audio only move while you are actually watching or listening -
   that is what keeps the hosting bill small. "Off" means the camera is told
   to stop sending entirely.
   =========================================================================== */

const FOCUS = {{ focus | tojson }};
const SNAPSHOT_EVERY = {{ snapshot_every }};
const AUDIO_RATE = {{ audio_rate }};
const BIN_VIDEO = 0x01, BIN_AUDIO = 0x02;

const modes = {};        // camId -> off | snapshot | live | hd
const listening = {};    // camId -> bool
const sockets = {};      // camId -> WebSocket
const urls = {};         // camId -> current object URL
let cams = [], events = [];
let talkCam = null, talkCtx = null, talkNode = null, talkStream = null;
let playCtx = null, playAt = 0;

const KIND_LABEL_DEVICE = {
  browser: "phone (browser)", android: "phone (app)",
  agent: "laptop / IP cam",
};

const KIND_LABEL = {
  motion: "Movement", sound: "Sound", cry: "Baby awake",
  impact: "Thud / fall", person: "Person seen", offline: "Camera offline",
  online: "Camera online", disk: "Storage low", test: "Test alert",
  moved: "Camera was moved", battery_low: "Battery low",
  conflict: "Two devices, one name", unplugged: "Unplugged"
};

/* ---------- status socket ---------- */
// This device's clock, not the server's. The server is in a datacentre
// somewhere and its idea of the time is not yours.
function startClock() {
  const tick = () => {
    document.getElementById("clock").textContent = clockStamp();
  };
  tick();
  setInterval(tick, 1000);
}

function connectDash() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/dash`);
  ws.onmessage = (e) => {
    const s = JSON.parse(e.data);
    cams = s.cameras; events = s.events;
    renderBanner(s);
    render();
  };
  ws.onclose = () => setTimeout(connectDash, 3000);
  setInterval(() => { if (ws.readyState === 1) ws.send("ping"); }, 25000);
}

function renderBanner(s) {
  const b = document.getElementById("banner");
  b.innerHTML = s.notifications ? "" :
    `<div class="banner"><strong>Push notifications are off.</strong>
      Set <code>NTFY_TOPIC</code> in your Railway variables and subscribe to
      the same topic in the ntfy app, or you will not be woken when your baby
      cries or someone enters.</div>`;
}

/* ---------- frame + audio socket per camera ---------- */
function setMode(camId, mode) {
  modes[camId] = mode;
  if (mode === "off") {
    if (listening[camId]) setListen(camId, false);
    if (talkCam === camId) stopTalk();
    const s = sockets[camId];
    if (s) { s.close(); delete sockets[camId]; }
    if (urls[camId]) { URL.revokeObjectURL(urls[camId]); delete urls[camId]; }
    render();
    return;
  }
  const s = sockets[camId];
  if (s && s.readyState === 1) { s.send(JSON.stringify({ mode })); render(); }
  else openSocket(camId, mode);
}

function openSocket(camId, mode) {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(
    `${proto}://${location.host}/ws/view?cam=${encodeURIComponent(camId)}&mode=${mode}`);
  ws.binaryType = "arraybuffer";
  sockets[camId] = ws;

  ws.onmessage = (e) => {
    if (typeof e.data === "string") return;
    const b = new Uint8Array(e.data);
    if (b[0] === BIN_VIDEO) {
      const img = document.getElementById("img-" + camId);
      if (!img) return;
      const blob = new Blob([b.subarray(1)], { type: "image/jpeg" });
      const old = urls[camId];
      urls[camId] = URL.createObjectURL(blob);
      img.src = urls[camId];
      if (old) URL.revokeObjectURL(old);
    } else if (b[0] === BIN_AUDIO) {
      playPcm(b.subarray(1));
    }
  };
  ws.onclose = () => {
    if (sockets[camId] === ws) {
      delete sockets[camId];
      if (modes[camId] && modes[camId] !== "off") {
        setTimeout(() => {
          if (modes[camId] && modes[camId] !== "off" && !sockets[camId])
            openSocket(camId, modes[camId]);
        }, 2500);
      }
    }
  };
  ws.onopen = () => {
    if (listening[camId]) ws.send(JSON.stringify({ listen: true }));
  };
  render();
}

/* ---------- listen (hear the room) ---------- */
function setListen(camId, on) {
  listening[camId] = on;
  if (on && (!modes[camId] || modes[camId] === "off")) {
    setMode(camId, "live");
  }
  const s = sockets[camId];
  if (s && s.readyState === 1) s.send(JSON.stringify({ listen: on }));
  if (on) {
    if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (playCtx.state === "suspended") playCtx.resume();
    playAt = 0;
  }
  render();
}

function playPcm(bytes) {
  if (!playCtx) return;
  const n = Math.floor(bytes.byteLength / 2);
  if (!n) return;
  const view = new DataView(bytes.buffer, bytes.byteOffset, n * 2);
  const buf = playCtx.createBuffer(1, n, AUDIO_RATE);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = view.getInt16(i * 2, true) / 32768;
  const src = playCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playCtx.destination);
  const now = playCtx.currentTime;
  if (playAt < now + 0.06) playAt = now + 0.12;   // small jitter cushion
  src.start(playAt);
  playAt += buf.duration;
}

/* ---------- talk (speak into the room) ---------- */
async function startTalk(camId) {
  if (talkCam) stopTalk();
  if (!modes[camId] || modes[camId] === "off") setMode(camId, "live");
  const s = sockets[camId];
  if (!s) { alert("Open the camera first."); return; }

  try {
    talkStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: false
    });
  } catch (e) { alert("Microphone not available: " + e.message); return; }

  talkCam = camId;
  s.send(JSON.stringify({ talk: true }));

  talkCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = talkCtx.createMediaStreamSource(talkStream);
  talkNode = talkCtx.createScriptProcessor(4096, 1, 1);
  let acc = [];
  const chunk = Math.round(AUDIO_RATE * 0.06);
  talkNode.onaudioprocess = (e) => {
    const sock = sockets[talkCam];
    if (!sock || sock.readyState !== 1) return;
    const input = e.inputBuffer.getChannelData(0);
    const ratio = talkCtx.sampleRate / AUDIO_RATE;
    for (let i = 0; i < input.length; i += ratio) acc.push(input[Math.floor(i)]);
    while (acc.length >= chunk) {
      const part = acc.slice(0, chunk);
      acc = acc.slice(chunk);
      const pcm = new Int16Array(part.length);
      for (let i = 0; i < part.length; i++) {
        const v = Math.max(-1, Math.min(1, part[i]));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
      }
      const out = new Uint8Array(1 + pcm.byteLength);
      out[0] = BIN_AUDIO;
      out.set(new Uint8Array(pcm.buffer), 1);
      sock.send(out);
    }
  };
  const mute = talkCtx.createGain();
  mute.gain.value = 0;
  src.connect(talkNode); talkNode.connect(mute); mute.connect(talkCtx.destination);
  render();
}

function stopTalk() {
  const s = talkCam ? sockets[talkCam] : null;
  if (s && s.readyState === 1) s.send(JSON.stringify({ talk: false }));
  if (talkNode) { try { talkNode.disconnect(); } catch (e) {} talkNode = null; }
  if (talkCtx) { try { talkCtx.close(); } catch (e) {} talkCtx = null; }
  if (talkStream) { talkStream.getTracks().forEach(t => t.stop()); talkStream = null; }
  talkCam = null;
  render();
}

function toggleTalk(camId) {
  if (talkCam === camId) stopTalk(); else startTalk(camId);
}

/* ---------- commands ---------- */
async function cmd(camId, what, body) {
  try {
    const r = await fetch(`/cmd/${encodeURIComponent(camId)}/${what}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {})
    });
    if (!r.ok) {
      let msg = await r.text();
      try { msg = JSON.parse(msg).detail || msg; } catch (e) {}
      alert("Did not work: " + msg);
    }
  } catch (e) { alert("Did not work: " + e); }
}

let ptzHold = null;
function ptzStart(camId, action) {
  cmd(camId, "ptz", { action, speed: 0.6 });
  clearTimeout(ptzHold);
  // Safety: always stop, even if the pointerup event is missed.
  ptzHold = setTimeout(() => cmd(camId, "ptz", { action: "stop" }), 2500);
}
function ptzStop(camId) {
  clearTimeout(ptzHold);
  cmd(camId, "ptz", { action: "stop" });
}

/* ---------- when a camera should be watching ----------

   Said as "when are you normally there", not "when should it be armed".
   That is the question somebody can actually answer about their own cabin,
   and the camera being armed the rest of the time follows from it. */
async function openSchedule(camId, camName) {
  const modal = document.getElementById("modal");
  document.getElementById("mTitle").textContent = `When ${camName} watches`;
  modal.classList.add("show");

  let now = {};
  try {
    const r = await fetch(`/schedule/${encodeURIComponent(camId)}`);
    now = await r.json();
  } catch (e) {}

  const row = now.schedule || {};
  const days = row.days || [0, 1, 2, 3, 4, 5, 6];
  const names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

  document.getElementById("mBody").innerHTML = `
    <div style="font-size:13px;color:#8b949e;margin-bottom:12px">
      Tell it when you are normally there and it will stop alerting about
      you - and arm itself again the rest of the time, without anybody
      having to remember.
      <br><br>Times are ${esc(now.timezone || "UTC")}; it is
      ${esc(now.clock || "")} there now.
    </div>
    <div class="inline" style="margin-bottom:10px">
      <label>I am there from</label>
      <input type="time" id="schFrom" value="${esc(row.off_from || "10:00")}">
      <label>until</label>
      <input type="time" id="schUntil" value="${esc(row.off_until || "19:00")}">
    </div>
    <div style="font-size:13px;color:#8b949e;margin-bottom:6px">On these days</div>
    <div class="btns" id="schDays" style="flex-wrap:wrap;margin-bottom:14px">
      ${names.map((n, i) => `<button data-day="${i}"
        class="${days.includes(i) ? "active" : ""}">${n}</button>`).join("")}
    </div>
    <div class="btns">
      <button onclick="saveSchedule('${esc(camId)}')">Save</button>
      <button class="ghost" onclick="clearSchedule('${esc(camId)}')">
        No schedule - I will arm it myself</button>
    </div>
    <div id="schMsg" style="font-size:13px;margin-top:10px;color:#8b949e"></div>`;

  document.querySelectorAll("#schDays button").forEach(b => {
    b.onclick = () => b.classList.toggle("active");
  });
}

async function saveSchedule(camId) {
  const days = [...document.querySelectorAll("#schDays button.active")]
    .map(b => Number(b.dataset.day));
  const body = {
    off_from: document.getElementById("schFrom").value,
    off_until: document.getElementById("schUntil").value,
    days: days.length === 7 ? null : days,
  };
  const msg = document.getElementById("schMsg");
  if (!days.length) {
    msg.textContent = "Pick at least one day, or choose no schedule.";
    return;
  }
  try {
    const r = await fetch(`/schedule/${encodeURIComponent(camId)}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) { msg.textContent = j.detail || "That did not save."; return; }
    msg.textContent = j.schedule && j.schedule.armed_now
      ? "Saved. It is watching now."
      : "Saved. It is leaving you alone just now.";
  } catch (e) {
    msg.textContent = "That did not save: " + e.message;
  }
}

async function clearSchedule(camId) {
  await fetch(`/schedule/${encodeURIComponent(camId)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: "{}",
  });
  document.getElementById("schMsg").textContent =
    "Schedule removed. Alerts are yours to turn on and off now.";
}

/* ---------- the recordings ----------

   A flat list of filenames is fine with six of them and useless with six
   hundred, which is what a day of round-the-clock recording looks like.
   So: one day at a time, a strip showing where in that day anything was
   recorded, and a filter for the clips something actually happened in.

   All of that is done here, in the page. The server holds no index and
   does no searching - it passes on what the device already knows and what
   it has a copy of, and nothing more. */
let clipState = { camId: "", camName: "", clips: [], saved: [],
                  day: "", eventsOnly: false, online: true };

async function openClips(camId, camName, online) {
  const modal = document.getElementById("modal");
  document.getElementById("mTitle").textContent = `Recordings - ${camName}`;
  document.getElementById("mBody").innerHTML =
    `<div style="color:#8b949e;font-size:13px">Asking the device...</div>`;
  modal.classList.add("show");

  clipState = { camId, camName, clips: [], saved: [], day: "",
                eventsOnly: false, online: online !== false };

  // The copies on the server are worth having either way, and they are the
  // only thing left to show when the device itself has gone.
  try {
    const r = await fetch(`/saved?cam=${encodeURIComponent(camId)}`);
    if (r.ok) clipState.saved = (await r.json()).clips || [];
  } catch (e) {}

  if (clipState.online) {
    try {
      const r = await fetch(`/clips/${encodeURIComponent(camId)}`);
      if (!r.ok) throw new Error(await r.text());
      clipState.clips = (await r.json()).clips || [];
    } catch (e) {
      clipState.error = e.message;
    }
  }
  renderClips();
}

function dayKey(at) {
  const d = new Date(at * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`
    + `-${String(d.getDate()).padStart(2, "0")}`;
}

function dayLabel(key) {
  const [y, m, d] = key.split("-").map(Number);
  const when = new Date(y, m - 1, d);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - when) / 86400000);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  return when.toLocaleDateString([], { weekday: "short", day: "numeric",
                                       month: "short" });
}

function renderClips() {
  const st = clipState;
  const saved = new Map(st.saved.map(r => [r.file, r]));

  // Everything the server has a copy of counts as a recording too, even
  // when the device that made it is long gone.
  const all = st.clips.slice();
  for (const row of st.saved) {
    if (!all.some(c => c.file === row.file)) {
      all.push({ file: row.file, at: Math.round(row.at),
                 size_mb: row.size_mb, keep: true, savedOnly: true });
    }
  }
  all.sort((a, b) => b.at - a.at);

  const days = [...new Set(all.map(c => dayKey(c.at)))];
  if (!st.day || !days.includes(st.day)) st.day = days[0] || "";

  const shown = all.filter(c => dayKey(c.at) === st.day
                                && (!st.eventsOnly || c.keep));

  const body = document.getElementById("mBody");
  if (!all.length) {
    body.innerHTML = `<div style="color:#8b949e;font-size:13px">`
      + (st.error ? `Could not read the device: ${esc(st.error)}`
         : st.online ? "Nothing recorded yet."
         : "This camera is not reporting, and the server has no copies of "
           + "its recordings.")
      + `</div>`;
    return;
  }

  body.innerHTML = `
    <video id="mPlayer" controls playsinline style="display:none"></video>
    ${st.online ? "" : `<div class="warn" style="margin-bottom:10px">
      This camera is not reporting. These are the copies kept on the
      server.</div>`}
    <div class="btns" style="flex-wrap:wrap;margin-bottom:10px">
      ${days.slice(0, 8).map(k => `<button data-day="${k}"
        class="${k === st.day ? "active" : ""}">${esc(dayLabel(k))}</button>`
      ).join("")}
    </div>
    <div class="btns" style="margin-bottom:10px">
      <button data-only="0" class="${st.eventsOnly ? "" : "active"}">Everything</button>
      <button data-only="1" class="${st.eventsOnly ? "active" : ""}">Only what happened</button>
    </div>
    <div class="strip" id="clipStrip">${hourStrip(all, st.day)}</div>
    <div style="font-size:12px;color:#6e7681;margin:8px 0">
      ${shown.length} of ${all.length} recordings. Marked ones had movement
      or a sound in them and are kept longer.
    </div>
    ${shown.length ? shown.map(c => clipRow(c, saved.get(c.file))).join("")
      : `<div style="color:#8b949e">Nothing on this day matches.</div>`}`;

  body.querySelectorAll("[data-day]").forEach(b => {
    b.onclick = () => { clipState.day = b.dataset.day; renderClips(); };
  });
  body.querySelectorAll("[data-only]").forEach(b => {
    b.onclick = () => {
      clipState.eventsOnly = b.dataset.only === "1"; renderClips();
    };
  });
  body.querySelectorAll("[data-hour]").forEach(b => {
    b.onclick = () => {
      const row = document.getElementById("clip-" + b.dataset.hour);
      if (row) row.scrollIntoView({ block: "center", behavior: "smooth" });
    };
  });
}

/* The day as twenty-four blocks, lit where something was recorded and
   coloured where something happened. A night of nothing reads as a night
   of nothing at a glance, which a list of filenames never does. */
function hourStrip(all, day) {
  const hours = Array.from({ length: 24 }, () => ({ n: 0, event: false }));
  for (const c of all) {
    if (dayKey(c.at) !== day) continue;
    const h = new Date(c.at * 1000).getHours();
    hours[h].n++;
    if (c.keep) hours[h].event = true;
  }
  return hours.map((h, i) => {
    const cls = h.event ? "hot" : (h.n ? "on" : "");
    const title = h.n ? `${h.n} at ${String(i).padStart(2, "0")}:00`
                      : `nothing at ${String(i).padStart(2, "0")}:00`;
    return `<i class="${cls}" data-hour="${i}" title="${title}"></i>`;
  }).join("");
}

function clipRow(c, savedRow) {
  const when = new Date(c.at * 1000);
  const time = when.toLocaleTimeString([], { hour: "2-digit",
                                             minute: "2-digit",
                                             second: "2-digit" });
  const hour = when.getHours();
  const src = c.savedOnly
    ? `/saved/${encodeURIComponent(savedRow.key)}`
    : `/clip/${encodeURIComponent(clipState.camId)}/${encodeURIComponent(c.file)}`;
  return `
    <div class="clip" id="clip-${hour}">
      <span>${esc(time)}</span>
      ${c.keep ? `<span class="kp">EVENT</span>` : ""}
      ${savedRow ? `<span class="kp cp" title="A copy is on the server, so
        this survives the camera going missing">COPY</span>` : ""}
      <span class="sp">
        <span style="color:#6e7681;align-self:center">${c.size_mb} MB</span>
        <button onclick="playSrc('${esc(src)}')">Play</button>
        <a href="${esc(src)}" download>Save</a>
      </span>
    </div>`;
}

function playSrc(src) {
  const v = document.getElementById("mPlayer");
  if (!v) return;
  v.style.display = "";
  v.src = src;
  v.play().catch(() => {});
  v.scrollIntoView({ block: "nearest" });
}

function closeModal() {
  const v = document.getElementById("mPlayer");
  if (v) { v.pause(); v.src = ""; }
  document.getElementById("modal").classList.remove("show");
}

/* ---------- render ----------
   Built once per camera, then updated in place. Rebuilding the markup on
   every status tick looked fine until you tried to use it: the <img> was
   replaced two or three times a second so the picture flickered, and the
   lens dropdown was destroyed under your finger the moment you opened it.
   Nothing here may replace an element the viewer might be interacting with.
*/
const cardEls = {};          // camId -> card element
let eventSig = "";

/* What you just asked for, while the camera is still catching up.
   Switching a lens takes a moment, and until it lands the camera keeps
   reporting the old one - so without this the dropdown snaps back a second
   after you choose, which reads as "it refused me". Your choice is held
   until the camera confirms it, or until it is clearly not coming. */
const pending = {};          // camId -> {field: {value, at}}

function setPending(camId, field, value) {
  (pending[camId] = pending[camId] || {})[field] = {value, at: Date.now()};
}

function heldValue(camId, field, reported) {
  const p = (pending[camId] || {})[field];
  if (!p) return reported;
  if (String(p.value) === String(reported)) {      // the camera agreed
    delete pending[camId][field];
    return reported;
  }
  if (Date.now() - p.at > 15000) {                 // it never happened
    delete pending[camId][field];
    return reported;
  }
  return p.value;
}

function render() {
  const grid = document.getElementById("grid");

  if (!cams.length) {
    if (grid.dataset.state !== "empty") {
      grid.dataset.state = "empty";
      grid.innerHTML = `<div class="empty">
        <h2>No cameras connected yet</h2>
        <p>Spare phone: tap <b>+ Phone</b> above, open that page on the phone
           and press Start.<br>
           Laptop or a camera on your home WiFi: run
           <code>python agent/agent.py</code> on a machine on that network.</p>
      </div>`;
      Object.keys(cardEls).forEach(k => delete cardEls[k]);
    }
    renderEvents();
    return;
  }

  if (grid.dataset.state === "empty") {
    grid.innerHTML = "";
    grid.dataset.state = "cards";
  }

  const seen = new Set();
  for (const c of cams) {
    seen.add(c.id);
    if (!(c.id in modes)) modes[c.id] = (c.id === FOCUS ? "live" : "off");
    let el = cardEls[c.id];
    if (!el) {
      el = buildCard(c);
      cardEls[c.id] = el;
      grid.appendChild(el);
    }
    updateCard(el, c);
    if (modes[c.id] !== "off" && !sockets[c.id]) openSocket(c.id, modes[c.id]);
  }
  for (const id of Object.keys(cardEls)) {
    if (!seen.has(id)) { cardEls[id].remove(); delete cardEls[id]; }
  }

  renderEvents();
}

function buildCard(c) {
  const el = document.createElement("div");
  el.className = "cam";
  el.innerHTML = `
    <div class="top">
      <span class="dot"></span>
      <span class="nm"></span>
      <span class="still"></span>
    </div>
    <div class="screen">
      <div class="idle">Tap <b>Snap</b> or <b>Live</b> to look<br>
        <small>nothing is sent while this is off</small></div>
      <div class="gonebox" style="display:none">This camera is not
        reporting<br><small>power, internet, or the app was closed</small></div>
      <img id="img-${c.id}" alt="" style="display:none">
      <div class="pill"></div>
      <div class="pad" style="display:none">
        <i></i><button data-ptz="up">&#9650;</button><i></i>
        <button data-ptz="left">&#9664;</button>
        <button class="mid" data-ptz="home">HOME</button>
        <button data-ptz="right">&#9654;</button>
        <i></i><button data-ptz="down">&#9660;</button><i></i>
      </div>
    </div>
    <div class="meter"><i></i></div>
    <div class="rows">
      <div class="seg">
        <button data-mode="off">Off</button>
        <button data-mode="snapshot">Snap</button>
        <button data-mode="live">Live</button>
        <button data-mode="hd">HD</button>
      </div>
      <div class="btns">
        <button data-act="listen"></button>
        <button data-act="talk"></button>
      </div>
      <div class="btns">
        <button data-act="record"></button>
        <button data-act="baby">Baby</button>
        <button data-act="arm">Alerts</button>
        <button data-act="clips">Clips</button>
        <button data-act="when" title="Set the hours you are normally there, so it arms itself around you">Hours</button>
        <button data-act="people" title="Only raise an alert when somebody is actually in view - a curtain or a fan will not">People only</button>
        <button data-act="noise" title="Cut steady fan and cooler noise so the baby is audible">Fan filter</button>
        <button data-act="rotate" title="Turn the picture a quarter turn - for a camera that is not mounted the right way up">Rotate</button>
        <button data-act="alarm" title="Sound a siren and flash the torch on the device itself">Siren</button>
        <button data-act="forget" class="ghost" style="display:none">Remove</button>
      </div>
      <div class="inline lensrow" style="display:none">
        <label>Lens</label><select data-act="lens"></select>
      </div>
      <div class="inline zoomrow" style="display:none">
        <label>Zoom</label>
        <input type="range" min="1" max="4" step="0.1" data-act="zoom">
      </div>
      <div class="btns presets" style="display:none"></div>
      <div class="device"></div>
      <div class="stats"></div>
    </div>`;

  const id = c.id;
  el.querySelectorAll("[data-mode]").forEach(b =>
    b.onclick = () => setMode(id, b.dataset.mode));

  el.querySelectorAll("[data-ptz]").forEach(b => {
    const action = b.dataset.ptz;
    if (action === "home") {
      b.onclick = () => cmd(id, "ptz", { action: "home" });
    } else {
      b.onpointerdown = () => ptzStart(id, action);
      b.onpointerup = () => ptzStop(id);
      b.onpointerleave = () => ptzStop(id);
    }
  });

  const act = sel => el.querySelector(`[data-act="${sel}"]`);
  act("listen").onclick = () => setListen(id, !listening[id]);
  act("talk").onclick = () => toggleTalk(id);
  act("record").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    cmd(id, "record", { on: !!c2.paused });      // paused -> resume
  };
  act("baby").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    cmd(id, "baby", { on: !c2.baby_mode });
  };
  act("arm").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    cmd(id, "arm", { on: !c2.armed });
  };
  act("clips").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    openClips(id, c2.name || id, c2.online);
  };
  act("people").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    cmd(id, "person", { on: !c2.person_detection });
  };
  act("when").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    openSchedule(id, c2.name || id);
  };
  act("alarm").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    if (!c2.alarm && !confirm(
        `Sound the siren on "${c2.name || id}"?\n\n`
        + `It will be loud, wherever that device is, and the torch will `
        + `flash. It stops by itself after two minutes.`)) return;
    cmd(id, "alarm", { on: !c2.alarm });
  };
  act("rotate").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    const next = ((Number(c2.rotate) || 0) + 90) % 360;
    setPending(id, "rotate", next);
    cmd(id, "rotate", { value: next });
  };
  act("forget").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    if (!confirm(`Remove "${c2.name || id}" from this list?\n\n`
                 + `Nothing recorded on the device is touched. If it `
                 + `connects again it comes straight back.`)) return;
    fetch("/camera/" + encodeURIComponent(id) + "/forget", { method: "POST" });
  };
  act("noise").onclick = () => {
    const c2 = cams.find(x => x.id === id) || {};
    cmd(id, "noise", { on: !c2.noise_filter });
  };
  act("lens").onchange = (e) => {
    setPending(id, "lens", e.target.value);
    cmd(id, "lens", { id: e.target.value });
  };
  act("zoom").onchange = (e) => {
    setPending(id, "zoom", Number(e.target.value));
    cmd(id, "zoom", { value: Number(e.target.value) });
  };

  return el;
}

function updateCard(el, c) {
  const mode = modes[c.id];
  const q = sel => el.querySelector(sel);

  el.classList.toggle("alert", !!(c.motion || c.sound));
  el.classList.toggle("offline", !c.online);
  q(".dot").className = "dot " + (c.online ? "on" : "off");
  setText(q(".nm"), c.name);

  // A camera that has stopped has exactly one thing worth saying, and it
  // is the question you actually have: when did it stop?
  if (!c.online) {
    const seen = c.last_seen
      ? `stopped <b class="gone">${dur(c.offline_for_s)} ago</b>`
        + `<br><small>${esc(clockTime(c.last_seen))}</small>`
      : "not reporting";
    setHtml(q(".still"), seen);
  } else {
    const quiet = (c.quiet_for_s == null) ? "no movement data"
      : (c.motion ? '<b class="moving">moving now</b>'
                 : `still for <b>${dur(c.quiet_for_s)}</b>`);
    const silent = (c.silent_for_s == null) ? ""
      : `<br>quiet for ${dur(c.silent_for_s)}`;
    setHtml(q(".still"), quiet + silent);
  }

  const tags = [];
  if (c.paused)    tags.push('<span class="tag pause">PAUSED</span>');
  if (c.recording) tags.push('<span class="tag rec">REC</span>');
  if (c.motion)    tags.push('<span class="tag mot">MOVING</span>');
  if (c.sound)     tags.push('<span class="tag snd">SOUND</span>');
  if (c.baby_mode) tags.push('<span class="tag">BABY</span>');
  if (!c.armed)    tags.push('<span class="tag">ALERTS OFF</span>');
  setHtml(q(".pill"), tags.join(""));

  // Nothing on a camera that is not there can be pressed, and the buttons
  // should look it rather than failing silently when tapped.
  el.querySelectorAll("button, select, input").forEach(b => {
    // Remove and Clips still work on a camera that is gone: Clips is how
    // you reach the copies the server kept, which is the whole point of
    // having kept them.
    if (b.dataset.act === "forget" || b.dataset.act === "clips") return;
    b.disabled = !c.online;
  });
  const forget = q('[data-act="forget"]');
  forget.style.display = c.online ? "none" : "";

  // The picture element itself is never replaced, only shown or hidden.
  const img = q("img"), idle = q(".idle");
  const gonebox = q(".gonebox");
  gonebox.style.display = c.online ? "none" : "flex";
  if (!c.online) {
    img.style.display = "none"; idle.style.display = "none";
  } else if (mode === "off") {
    img.style.display = "none"; idle.style.display = "";
  } else {
    idle.style.display = "none";
    if (img.src) img.style.display = "block";
  }

  const pad = q(".pad");
  pad.style.display = (mode !== "off" && c.ptz) ? "" : "none";

  const lvl = q(".meter > i");
  lvl.style.width = Math.min(100, Math.round((c.audio_level || 0) * 300)) + "%";
  lvl.className = (c.sound || (c.audio_level || 0) > 0.05) ? "hot" : "";

  el.querySelectorAll("[data-mode]").forEach(b =>
    b.classList.toggle("sel", b.dataset.mode === mode));

  const listen = q('[data-act="listen"]');
  setText(listen, listening[c.id] ? "Listening" : "Listen");
  listen.classList.toggle("active", !!listening[c.id]);
  listen.disabled = !c.has_audio;

  const talk = q('[data-act="talk"]');
  setText(talk, talkCam === c.id ? "Talking - tap to end" : "Talk");
  talk.classList.toggle("talking", talkCam === c.id);
  talk.disabled = !c.has_speaker;

  // Recording normally runs around the clock, so this is pause and resume,
  // not start and stop - and it has to say which it will do, not what the
  // camera is doing.
  const rec = q('[data-act="record"]');
  setText(rec, c.paused ? "Resume" : "Pause rec");
  rec.classList.toggle("recon", !c.paused && !!c.recording);
  rec.classList.toggle("active", !!c.paused);
  q('[data-act="baby"]').classList.toggle("active", !!c.baby_mode);
  q('[data-act="arm"]').classList.toggle("active", !!c.armed);

  // The filter only has a say over the microphone, so a camera without one
  // cannot use it.
  const noise = q('[data-act="noise"]');
  noise.classList.toggle("active", !!c.noise_filter);
  noise.disabled = !c.has_audio;

  // Say which way it is turned, so a camera left sideways is obvious
  // without having to work it out from the picture.
  // Only meaningful away from a cot: for a baby, any movement is the point.
  const people = q('[data-act="people"]');
  people.classList.toggle("active", !!c.person_detection);
  people.style.display = c.baby_mode ? "none" : "";

  const siren = q('[data-act="alarm"]');
  setText(siren, c.alarm ? "Siren - stop" : "Siren");
  siren.classList.toggle("talking", !!c.alarm);
  siren.disabled = !c.has_siren;

  const turn = Number(heldValue(c.id, "rotate", c.rotate)) || 0;
  const rot = q('[data-act="rotate"]');
  setText(rot, turn ? `Rotate ${turn}\u00B0` : "Rotate");
  rot.classList.toggle("active", turn !== 0);

  // A dropdown is only rebuilt when its choices actually change, and never
  // while it is open - otherwise it shuts the moment you reach for it.
  const lensRow = q(".lensrow"), lens = q('[data-act="lens"]');
  if (c.lenses && c.lenses.length > 1) {
    lensRow.style.display = "";
    const sig = c.lenses.map(l => l.id + "|" + l.label).join(",");
    if (lens.dataset.sig !== sig && document.activeElement !== lens) {
      lens.dataset.sig = sig;
      lens.innerHTML = c.lenses.map(l =>
        `<option value="${esc(l.id)}">${esc(l.label)}</option>`).join("");
    }
    const wantLens = heldValue(c.id, "lens", c.active_lens);
    if (document.activeElement !== lens && wantLens != null
        && lens.value !== String(wantLens)) {
      lens.value = String(wantLens);
    }
  } else {
    lensRow.style.display = "none";
  }

  const zoomRow = q(".zoomrow"), zoom = q('[data-act="zoom"]');
  if (c.kind === "browser" || c.ptz) {
    zoomRow.style.display = "";
    const wantZoom = heldValue(c.id, "zoom", c.zoom);
    if (document.activeElement !== zoom && wantZoom != null
        && Number(zoom.value) !== Number(wantZoom)) {
      zoom.value = wantZoom;
    }
  } else {
    zoomRow.style.display = "none";
  }

  const presets = q(".presets");
  const psig = (c.ptz_presets || []).join(",");
  if (presets.dataset.sig !== psig) {
    presets.dataset.sig = psig;
    presets.style.display = psig ? "" : "none";
    presets.innerHTML = (c.ptz_presets || []).map(p =>
      `<button data-preset="${esc(p)}">${esc(p)}</button>`).join("");
    presets.querySelectorAll("[data-preset]").forEach(b =>
      b.onclick = () => cmd(c.id, "ptz",
                           { action: "preset", preset: b.dataset.preset }));
  }

  // The device's own condition: is it charged, where is it, has it been
  // interfered with. Separate from what the camera can see, because when
  // somebody is moving the camera itself this is the part you need.
  const dev = [];
  if (c.battery != null) {
    const cls = c.charging ? "chg" : (c.battery < 25 ? "low" : "");
    dev.push(`<span class="bat ${cls}">${batteryIcon(c.battery, c.charging)} `
      + `${c.battery}%${c.charging ? " charging" : ""}</span>`);
  }
  if (c.location && c.location.lat != null) {
    const { lat, lon } = c.location;
    const acc = c.location.accuracy_m != null
      ? ` ±${Math.round(c.location.accuracy_m)}m` : "";
    dev.push(`<a href="https://www.google.com/maps?q=${lat},${lon}"
      target="_blank" rel="noopener">&#128205; ${lat.toFixed(5)}, `
      + `${lon.toFixed(5)}${acc}</a>`);
  }
  if (c.moved_ago_s != null && c.moved_ago_s < 86400) {
    dev.push(`<span class="tamper">&#9888; moved ${dur(c.moved_ago_s)} ago</span>`);
  }
  setHtml(q(".device"), dev.join(""));

  const stats = [];
  if (c.disk_free_gb != null) stats.push(`<span>${c.disk_free_gb} GB free</span>`);
  if (c.clips) stats.push(`<span>${c.clips} clips on device</span>`);
  if (c.retention_hours) stats.push(`<span>${c.retention_hours}h kept</span>`);
  stats.push(`<span>${esc(KIND_LABEL_DEVICE[c.kind] || "camera")}</span>`);
  setHtml(q(".stats"), stats.join(""));
}

/* Only touch the DOM when the value really changed - otherwise the browser
   redraws constantly and selections flicker. */
function setText(el, value) {
  const v = String(value == null ? "" : value);
  if (el.textContent !== v) el.textContent = v;
}
function setHtml(el, value) {
  const v = String(value == null ? "" : value);
  if (el.innerHTML !== v) el.innerHTML = v;
}

function renderEvents() {
  const box = document.getElementById("events");
  const sig = events.length ? events[0].id + ":" + events.length : "none";
  if (sig === eventSig) return;          // nothing new, leave it alone
  eventSig = sig;

  if (!events.length) {
    box.innerHTML = `<div class="ev"><div class="txt"><div class="d">
      Nothing yet. Movement, sounds and cameras going on or offline appear
      here.</div></div></div>`;
    return;
  }
  box.innerHTML = events.map(e => `
    <div class="ev k-${esc(e.kind)}">
      ${e.thumb ? `<img src="${e.thumb}" alt=""
         onclick="window.open('${e.thumb}','_blank')">` : ""}
      <div class="txt">
        <div class="k">${esc(KIND_LABEL[e.kind] || e.kind)}</div>
        <div class="d">${esc(e.camera_name)}${e.detail ? " - " + esc(e.detail) : ""}</div>
      </div>
      <div class="t">${esc(clockTime(e.at))}
        ${e.saved ? `<br><a class="saved" href="${esc(e.saved)}"
          target="_blank" title="A copy of this clip is on the server, so it
          is still here even if the camera is not">saved clip</a>` : ""}</div>
    </div>`).join("");
}

function batteryIcon(pct, charging) {
  if (charging) return "\u26A1";
  return pct < 15 ? "\u{1FAAB}" : "\u{1F50B}";
}

/* Times are sent as the moment they happened, and written here against
   this device's own clock - the server's timezone is nobody's business and
   on Railway it is UTC, which is five and a half hours out in India. */
function clockTime(at) {
  if (!at) return "";
  const d = new Date(at * 1000);
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  const time = d.toLocaleTimeString([], {
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
  if (sameDay) return time;
  return d.toLocaleDateString([], { day: "numeric", month: "short" })
    + ", " + time;
}

function clockStamp(at) {
  const d = at ? new Date(at * 1000) : new Date();
  return d.toLocaleDateString([], {
    day: "numeric", month: "short", year: "numeric"
  }) + " " + d.toLocaleTimeString([], {
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

function dur(s) {
  s = Number(s) || 0;
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 5400) return `${Math.round(s / 60)} min`;
  return `${Math.round(s / 360) / 10} h`;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

// Stop sending video when the dashboard is hidden - it saves the phone's
// battery and the hosting bandwidth.
let hiddenModes = null;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    hiddenModes = { ...modes };
    Object.keys(modes).forEach(id => { if (modes[id] !== "off") setMode(id, "off"); });
  } else if (hiddenModes) {
    Object.entries(hiddenModes).forEach(([id, m]) => { if (m !== "off") setMode(id, m); });
    hiddenModes = null;
  }
});

startClock();
connectDash();
</script>
</body>
</html>
