name: Build apps

# Runs the checks, then builds the two things you install on a device:
#   - the Android camera app  (APK)
#   - the laptop camera agent (Windows .exe, no Python needed)
#
# Both are attached to the run as artifacts. Publishing a release with plain
# download links is deliberate, not automatic: run this workflow by hand from
# the Actions tab and tick "publish". That way nothing is ever put out
# publicly without somebody asking for it.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release with plain download links'
        type: boolean
        default: false

# One run per branch. Pushing again drops the older run rather than leaving
# it to finish a build nobody is waiting for any more.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # This step is the least predictable one in the whole workflow: it took
      # 30 seconds on one run and 5 minutes on the next, because
      # "--with-deps" shells out to apt and apt is at the mercy of whichever
      # mirror answers. Nothing here had a deadline, so a mirror that never
      # answered would have held the runner until the job's own limit. Hence
      # a deadline, apt told not to ask questions, and a fallback to the
      # plain browser install - the runner image already carries nearly
      # every library Chromium wants.
      - name: Install what the checks need
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          python -m pip install --upgrade pip
          # The camera side without sounddevice: a CI runner has no audio
          # device, and the agent is written to carry on without one.
          pip install "opencv-python>=4.9.0,<5.0" "numpy>=1.24.0" \
                      "websocket-client>=1.7.0" "imageio-ffmpeg>=0.5.1" \
                      "pystray>=0.19.5" "pillow>=10.0.0"
          pip install -r requirements.txt
          pip install playwright
          timeout 10m playwright install --with-deps chromium \
            || playwright install chromium

      - name: Run them
        # Some of these drive a real browser and record real video, so give
        # them room; a hung test should still not hold the runner all day.
        timeout-minutes: 25
        run: python tests/run_all.py

  # -------------------------------------------------------------------------
  apk:
    name: Android camera app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu runner already ships the Android SDK, so there is nothing
      # to install. Just accept the licences so the Gradle plugin may fetch
      # any platform or build-tools version it still needs.
      - name: Prepare the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms yet)"
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      # One key for every build, so an update installs over the top.
      # Without it Gradle invents a throwaway key per machine and the phone
      # refuses the install, because an app may only be replaced by one
      # signed with the same key. The keystore is a repository secret; if
      # it is not set up the build still works, it just cannot update an
      # app that is already on the phone.
      - name: Unlock the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. This build is signed with a throwaway key, so it cannot install over an existing CabinWatch - see the README."
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cabinwatch.jks"
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: android
        env:
          CABINWATCH_KEYSTORE: ${{ steps.signing.outputs.signed == 'yes' && format('{0}/cabinwatch.jks', runner.temp) || '' }}
          CABINWATCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CABINWATCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'cabinwatch' }}
          # Each build is a later version than the one before it.
          CABINWATCH_BUILD: ${{ github.run_number }}
          CABINWATCH_VERSION: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # A phone will not say why it refused an APK, so check here instead.
      - name: Check it is signed with the key we meant
        run: |
          apk=$(find android -name "*.apk" | head -1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          fingerprint=$(grep -m1 -i "SHA-256 digest" certs.txt | awk '{print $NF}')
          echo "signed by: $fingerprint"
          if [ "${{ steps.signing.outputs.signed }}" = "yes" ]; then
            echo "$fingerprint" > signature.txt
            echo "::notice::APK signed with the stable key ($fingerprint). Updates will install over the top."
          else
            echo "::warning::APK signed with a throwaway key ($fingerprint). It cannot update an app already on the phone."
          fi

      - name: Rename and report
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CabinWatch-camera.apk
          ls -lh CabinWatch-camera.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cabinwatch-camera-apk
          path: CabinWatch-camera.apk
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------------
  exe:
    name: Laptop agent (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install what the agent needs
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt
          # Latest, not pinned: an older PyInstaller ships hooks that miss
          # part of numpy 2.x, and the executable then dies on startup with
          # "No module named numpy._core._exceptions".
          pip install --upgrade pyinstaller
          python -c "import PyInstaller, numpy, cv2; print('pyinstaller', PyInstaller.__version__, '| numpy', numpy.__version__, '| cv2', cv2.__version__)"

      # One file, with a console window. The console earns its place here: it
      # is where the first-run questions are asked and where the running
      # status is printed.
      - name: Build the executable
        run: >
          pyinstaller --onefile --windowed
          --name CabinWatch-Agent
          --paths agent
          --hidden-import ptz
          --hidden-import recorder
          --hidden-import detect
          --hidden-import setup_wizard
          --hidden-import config_example
          --hidden-import muxer
          --hidden-import local_ui
          --hidden-import resample
          --collect-all numpy
          --collect-all cv2
          --collect-all sounddevice
          --collect-all imageio_ffmpeg
          --collect-all pystray
          --collect-all PIL
          agent/agent.py

      # --help alone only proves argparse survived. --list-cameras imports
      # OpenCV, opens a capture and queries the audio devices, which is where
      # a bad bundle actually shows itself.
      # Built windowed, for the tray, so it has no console: running it and
      # looking at what it printed no longer works, and PowerShell does not
      # even wait for a windowed program unless told to. Both of those would
      # make this check pass without having checked anything, so it waits for
      # the exit code and then reads the log the agent writes beside itself.
      - name: Check it actually runs
        run: |
          dir dist
          $log = Join-Path (Resolve-Path .\dist) 'cabinwatch.log'
          if (Test-Path $log) { Remove-Item $log }
          $run = Start-Process -FilePath .\dist\CabinWatch-Agent.exe `
                               -ArgumentList '--list-cameras' `
                               -WorkingDirectory (Resolve-Path .\dist) `
                               -PassThru -Wait
          if ($run.ExitCode -ne 0) {
            throw "the agent exited with $($run.ExitCode)"
          }
          if (-not (Test-Path $log)) {
            throw "no log file: a windowed build with nowhere to talk is one nobody can debug"
          }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'Cameras this machine can open')) {
            throw "it started but never got as far as looking for cameras"
          }
          if (Select-String -Path $log -Pattern 'Traceback|ModuleNotFoundError') {
            throw "it started and then fell over - see the log above"
          }
          Write-Host "The windowed executable runs, finds its parts, and logs."

      # A silent recording is the bug this guards against: if ffmpeg did not
      # make it into the bundle, every saved clip loses its sound and nothing
      # says so until somebody plays one back.
      - name: Check ffmpeg came along, so recordings keep their sound
        run: |
          $env:PYTHONPATH = "agent"
          python -c "import sys; sys.path.insert(0,'agent'); import muxer; p = muxer.ffmpeg(); print('ffmpeg:', p); sys.exit(0 if p else 1)"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cabinwatch-laptop-agent-exe
          path: dist/CabinWatch-Agent.exe
          if-no-files-found: error
          retention-days: 90

  # -------------------------------------------------------------------------
  release:
    name: Publish download links
    # Only ever on a deliberate run with the box ticked.
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [checks, apk, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cabinwatch-camera-apk
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: cabinwatch-laptop-agent-exe
          path: out

      - name: Attach both to the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest-build
        run: |
          ls -lh out
          cat > notes.md <<'EOF'
          Ready-to-install builds of the two camera apps. They are replaced
          here whenever this is published again, so these links always point
          at the newest version.

          **Spare Android phone** — download `CabinWatch-camera.apk` on the
          phone and open it. Android will ask you to allow installing from
          outside the Play Store; that is expected for an app you built
          yourself.

          If it says only **"App not installed"**, the copy already on the
          phone was signed with a different key — uninstall CabinWatch and
          install this one. The README explains how to stop that happening
          again.

          **Laptop** — download `CabinWatch-Agent.exe` on the laptop and run
          it. It asks for your server address and token the first time, finds
          the cameras on the machine, and saves the answers next to itself.
          No Python needed. It then lives in the system tray: right-click the
          icon for the settings, the recordings folder, or to stop it.

          Neither file contains your server address or your token. You type
          those in once per device and they stay on that device.

          ### In these builds

          - **Fan filter** - cuts a fan or cooler so a baby can be heard over
            it, and so the crying alert fires at all
          - **Rotate** - for a phone hung upside down or propped on its side;
            the recordings come out straight too
          - **People only** - the cabin camera stops alerting about curtains
          - **Siren** - the device screams, with its torch flashing
          - **Unplugged alert** - the moment the charger comes out
          - **Event clips copied to the server**, so footage survives the
            camera being taken
          - **Recordings survive a power cut** - the last second or two is
            lost instead of the whole clip
          - **Battery, location and "camera was moved"** on the dashboard
          - **Comes back by itself** - the phone app checks on itself every
            quarter of an hour; the laptop agent can start with Windows
          - **Standby** - a camera on battery stops recording and watching,
            holds only its connection, and wakes when you open it to look.
            Days on a charge instead of one night. The server also does it
            on its own below 30% rather than letting the phone die
          - **The laptop agent runs in the tray** - no console window on the
            desktop, and a `cabinwatch.log` beside the exe to look at when
            something went wrong overnight
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" out/* \
              --title "CabinWatch apps (latest build)" \
              --notes-file notes.md \
              --prerelease
          fi
          echo "---------------------------------------------"
          echo "Download links:"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CabinWatch-camera.apk"
          echo "  https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CabinWatch-Agent.exe"
          echo "---------------------------------------------"
