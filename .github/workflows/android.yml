name: Build Android APK

# Builds the camera app and leaves an installable APK attached to the run, so
# you can put it on a spare phone without installing Android Studio.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The ubuntu runner already ships the Android SDK, so there is nothing
      # to install. Just accept the licences so the Gradle plugin may fetch
      # any platform or build-tools version it still needs.
      - name: Prepare the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms yet)"
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report the APK size
        working-directory: android
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: cabinwatch-camera-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
